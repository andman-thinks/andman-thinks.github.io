<html>
	<head>
		<title> Class 13 Demo </title>
		<meta name="viewport" content="width=device-width" />

		<!-- link the css -->
		<link rel="stylesheet" href="style.css"/>
	</head>


	<body>
		<p id="important">
			>>>>>alligator party!!!
		</p>
		<!-- add p tag -->
		<p> 
			~~shake it mama~~~~~
		</p>

		<!-- ass a p tag with a class -->
		<!-- class names cant have spaces, spaces make several classes -->

		<p class="croc">
			*🐊*🐊*🐊*
		</p>

		<p class="green">
			..... lets get <em> swampy </em>
		</p>

		<!-- generic inline group -->

		<span class="purple">
			shimmy shimmy
		</span>

		<span class="big">
			oh yeahhh
		</span>

		<span class="big purple">
			shakey shakey
		</span>

		<!-- you can use a class many times -->
		<!-- you can only use an id one time -->


	</body>

</html>
